<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Format your rich text to be compatible with Pixiv Novel." />
    <meta name="keywords" content="Pixiv, novel, web novel, formatter, novel formatter" />
    <meta name="theme-color" content="#0096fa" />
    <meta name="author" content="SillyBear7214" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <title>RichText-to-Pixiv Novel Formatter</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            --primary-color: #0096fa;
            --primary-color-hover: #1fa3fb;
            --primary-color-pressed: #33abfb;
        }

        body {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body>* {
            padding: 0;
            margin: 0;
        }

        body>nav {
            box-sizing: border-box;
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            user-select: none;
        }

        body>main {
            flex-grow: 2;
            position: relative;
        }

        body h1,
        body h2 {
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body button {
            user-select: none;
            border: none;
            border-radius: 24px;
            font-size: 1em;
            color: white;
            background-color: var(--primary-color);
            padding: 8px;
            min-width: 96px;
        }

        body button:hover {
            background-color: var(--primary-color-hover);
        }

        body button:active {
            background-color: var(--primary-color-pressed);
        }

        body input[type=text] {
            padding: 8px;
            min-width: 180px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        body input[type=text]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: inset 0 0 10px rgba(74, 144, 226, 0.3);
        }

        noscript {
            color: #fff;
            background-color: #fe0000;
            text-align: center;
            padding: 10px;
        }

        .screen {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
        }

        .screen>* {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .screen>*>:last-child {
            position: relative;
            flex-grow: 2;
        }

        .screen>*>:last-child>* {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .screen>:first-child h2 {
            padding: 8px 10px;
        }

        .screen>:last-child h2 {
            padding: 8px 10px 8px 0;
        }

        .screen>:first-child button {
            margin: 0 10px 8px 10px;
        }

        .screen>:last-child button {
            margin: 0 10px 8px 0;
        }

        @media (max-width: 720px) {
            .screen {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
            }

            .screen>* {
                height: 50%;
                width: 100%;
                display: flex;
                flex-direction: column;
            }

            .screen>:last-child h2 {
                padding: 8px 10px;
            }

            .screen>:last-child button {
                margin: 0 10px 8px 10px;
            }
        }

        .styled-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: scroll;
            box-sizing: border-box;
            background-color: #fff;
        }

        .styled-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: inset 0 0 10px rgba(74, 144, 226, 0.3);
        }

        .styled-textarea:empty::before {
            color: #676767;
            user-select: none;
        }

        .styled-textarea.input-area:empty::before {
            content: "Input your text here...";
        }

        .styled-textarea.output-area:empty::before {
            content: "And it will generate Pixiv-novel-compatible text right here.";
        }

        .text-input-with-title {
            position: relative;
        }

        .text-input-with-title::after {
            position: absolute;
            top: -1.05em;
            left: 6px;
            font-size: .8em;
            background-color: white;
            user-select: none;
        }

        .text-input-with-title.replace-horizontal-line-container::after {
            content: "Horizontal Line";
        }
    </style>
</head>

<body>
    <noscript>This page requires JavaScript enabling to be able to functionally work</noscript>
    <nav>
        <h1>RichText-to-Pixiv Novel Formatter</h1>
    </nav>
    <main>
        <div class="screen">
            <div>
                <h2>Input</h2>
                <div>
                    <button id="clearBtn">Clear</button>
                    <label class="text-input-with-title replace-horizontal-line-container">
                        <input type="text" id="replaceHrWith" placeholder="Replace with..." />
                    </label>
                </div>
                <div>
                    <div id="inputArea" class="styled-textarea input-area" contenteditable="true"></div>
                </div>
            </div>
            <div>
                <h2>Result</h2>
                <div>
                    <button id="copyBtn">Copy</button>
                </div>
                <div>
                    <div id="outputArea" class="styled-textarea output-area"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        (() => {
            let finalResult = '';
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const replaceHrWithTextBox = document.getElementById('replaceHrWith');

            new MutationObserver(function (r, o) {
                submit();
            }).observe(inputArea, { attributes: true, subtree: true, childList: true, characterData: true });
            replaceHrWithTextBox.addEventListener('input', submit);
            clearBtn.addEventListener('click', clearTextArea);
            copyBtn.addEventListener('click', copyToClipboard);

            /**
             * @param {string} fontWeight
             * @returns {boolean}
             */
            function isFontWeightBold(fontWeight) {
                return fontWeight === 'bold' || (fontWeight - 0) >= 600;
            }

            /**
             * @param {Node} node
             * @returns {string}
             */
            function parseNodes(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    return node.nodeValue;
                }

                let text = "";

                node.childNodes.forEach(child => {
                    text += parseNodes(child);
                });

                const tagName = node.tagName ? node.tagName.toLowerCase() : "";
                const tagStyle = node.style;
                const tagFontStyle = tagStyle ? tagStyle.fontStyle : '';
                const tagFontWeight = tagStyle ? tagStyle.fontWeight : '';

                if (tagName === "hr") {
                    return ((replaceHrWithTextBox.value || '\0') + '\n\n').replace(/^\0\n\n$/g,'');
                }
                if (tagName === "br") {
                    return "\n";
                }

                if (tagName === "b" || tagName === "strong" || isFontWeightBold(tagFontWeight)) {
                    text = `[b:${text}]`;
                }
                if (tagName === "i" || tagName === "em" || tagFontStyle === 'italic') {
                    text = `[i:${text}]`;
                }
                if (tagName === "div" || tagName === "p") {
                    text = (text ? "\n" + text : "\n") + "\n";
                }

                return text.slice(text.length - 2, text.length - 1) !== "\n" ? `${text} ` : text;
            }

            function submit() {
                finalResult = parseNodes(inputArea).trim();

                finalResult = finalResult
                .replace(/\[i\:\s+/g, '[i:')
                .replace(/\[b\:\s+/g, '[b:')
                .replace(/\]\s*\]/g,']]')
                .replace(/\[[ib]\:\s*]/g, '')
                .replace(/\[[ib]\:\s*]/g, '')
                .replace(/\n\n/g,'\n');

                if (finalResult) {
                    outputArea.innerText = finalResult;
                } else {
                    inputArea.innerHTML = outputArea.innerHTML = '';
                }

                copyBtn.innerText = 'Copy';
            }

            function clearTextArea() {
                inputArea.innerHTML = '';
                copyBtn.innerText = 'Copy';
            }

            function copyToClipboard(el) {
                if (!finalResult) return;
                navigator.clipboard.writeText(finalResult);
                copyBtn.innerText = 'Copied!';
            }
        })();
    </script>
</body>

</html>
